# Stores one snapshot of ship positions in the Turso database every 10 minutes.
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   BARENTSWATCH_CLIENT_ID, BARENTSWATCH_CLIENT_SECRET, TURSO_DATABASE_URL, TURSO_AUTH_TOKEN
name: Samle inn skipsdata

on:
  schedule:
    - cron: "*/10 * * * *"   # UTC; GitHub may delay or skip runs when busy
  workflow_dispatch:          # lets you start a run by hand from the Actions tab

# Never run two collections at the same time
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-collector.txt
      - run: pip install -r requirements-collector.txt
      - name: Samle inn
        env:
          BARENTSWATCH_CLIENT_ID: ${{ secrets.BARENTSWATCH_CLIENT_ID }}
          BARENTSWATCH_CLIENT_SECRET: ${{ secrets.BARENTSWATCH_CLIENT_SECRET }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          # Without the cloud database the data would land in a temporary file and be lost
          if [ -z "$TURSO_DATABASE_URL" ]; then
            echo "Mangler TURSO_DATABASE_URL i repository secrets"; exit 1
          fi
          python collector.py --once
